<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Makai · Documentos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0c0c0b; --surface: #161614; --surface-2: #1e1e1b;
  --border: rgba(255,255,255,.08);
  --green: #82b870; --green-dim: #4A5E3F;
  --amber: #c97c40; --text: #F1EDE3; --muted: #7a7670; --red: #c0433a;
}
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; -webkit-font-smoothing: antialiased; }

/* ── SIDEBAR ── */
.sidebar { width: 220px; min-height: 100vh; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; position: fixed; left: 0; top: 0; bottom: 0; z-index: 10; }
.sidebar-logo { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.sidebar-logo-mark { width: 28px; height: 28px; background: var(--green-dim); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--green); }
.sidebar-logo-name { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--text); }
.sidebar-logo-sub { font-size: 9px; color: var(--muted); letter-spacing: .06em; }
.nav { padding: 16px 10px; flex: 1; }
.nav-label { font-size: 8.5px; font-weight: 600; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; padding: 0 10px; margin-bottom: 6px; margin-top: 16px; }
.nav-label:first-child { margin-top: 0; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); cursor: pointer; text-decoration: none; transition: background .15s, color .15s; margin-bottom: 1px; }
.nav-item:hover { background: rgba(255,255,255,.05); color: var(--text); }
.nav-item.active { background: rgba(130,184,112,.1); color: var(--green); }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }
.nav-item .badge { margin-left: auto; background: var(--amber); color: #fff; font-size: 9px; font-weight: 700; border-radius: 10px; padding: 1px 6px; }
.sidebar-user { padding: 14px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.sidebar-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--green-dim); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--green); flex-shrink: 0; }
.sidebar-user-info { flex: 1; min-width: 0; }
.sidebar-user-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-user-role { font-size: 10px; color: var(--muted); }

/* ── MAIN ── */
.main { margin-left: 220px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.topbar { padding: 18px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; background: var(--bg); position: sticky; top: 0; z-index: 9; }
.topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }
.topbar-sub { font-size: 12px; color: var(--muted); margin-left: auto; }

/* ── DOCUMENT LIST ── */
.list-area { padding: 28px 32px; max-width: 900px; }

/* Toolbar */
.list-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.list-filter-tabs { display: flex; gap: 3px; }
.list-tab { padding: 5px 13px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--muted); cursor: default; border: 1px solid transparent; user-select: none; }
.list-tab.active { background: var(--surface); border-color: var(--border); color: var(--text); }
.list-status-info { margin-left: auto; font-size: 12px; }
.list-group-label { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 10px; }
.list-group-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

/* Shared helpers */
.doc-version { display: inline-flex; align-items: center; font-size: 9px; font-weight: 700; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
.doc-type-dot { border-radius: 50%; flex-shrink: 0; }
.status-pill { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 9px; border-radius: 10px; white-space: nowrap; }
.status-pill.pending { background: rgba(201,124,64,.14); color: var(--amber); }
.status-pill.signed { background: rgba(130,184,112,.12); color: var(--green); }
.status-pill.approved { background: rgba(130,184,112,.12); color: var(--green); }
.status-pill.rejected { background: rgba(201,124,64,.1); color: var(--amber); }
.status-pill.closed { background: rgba(122,118,112,.1); color: var(--muted); }

/* Doc item — unified card */
.doc-item { display: flex; align-items: center; gap: 16px; padding: 15px 18px 15px 0; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 7px; cursor: pointer; transition: background .12s, border-color .15s; position: relative; overflow: hidden; }
.doc-item:hover { border-color: rgba(255,255,255,.15); }
.doc-item.is-pending { background: rgba(201,124,64,.025); }
.doc-item.is-pending:hover { background: rgba(201,124,64,.04); border-color: rgba(201,124,64,.25); }
.doc-item.is-done:hover { background: rgba(255,255,255,.02); }

/* Left accent strip */
.doc-accent { width: 3px; align-self: stretch; flex-shrink: 0; border-radius: 0 2px 2px 0; min-height: 42px; }

/* Type icon badge */
.doc-icon-wrap { width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* Content */
.doc-content { flex: 1; min-width: 0; }
.doc-item-title { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; line-height: 1.3; }
.doc-item-meta { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.doc-meta-sep { opacity: .35; }
.doc-expiry-inline { color: var(--amber); font-weight: 500; display: inline-flex; align-items: center; gap: 3px; }

/* Right cluster */
.doc-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.doc-amount-col { text-align: right; }
.doc-amount-val { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -.02em; line-height: 1.2; }
.doc-amount-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* CTAs */
.btn-review { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: all .15s; white-space: nowrap; }
.btn-review.primary { background: var(--amber); color: #fff; }
.btn-review.primary:hover { background: #d88d4e; }
.btn-review.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-review.secondary:hover { color: var(--text); border-color: rgba(255,255,255,.18); }

/* ══════════════════════════════════════
   DOCUMENT MODAL
══════════════════════════════════════ */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; display: none; align-items: center; justify-content: center; padding: 32px; }
.modal-overlay.open { display: flex; }
.modal-shell { position: relative; width: 100%; max-width: 1200px; height: 100%; max-height: 840px; }
.modal-inner { display: flex; width: 100%; height: 100%; border-radius: 16px; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,.7); border: 1px solid rgba(255,255,255,.08); }
.modal-close-x { position: absolute; top: 12px; right: 12px; z-index: 10; width: 30px; height: 30px; border-radius: 50%; background: rgba(14,14,13,.8); border: 1px solid rgba(255,255,255,.14); color: rgba(255,255,255,.5); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; font-family: 'Inter', sans-serif; }
.modal-close-x:hover { background: rgba(30,30,27,.95); border-color: rgba(255,255,255,.28); color: #fff; }

/* PDF Viewer */
.pdf-viewer { flex: 0 0 62%; background: #111110; display: flex; flex-direction: column; overflow: hidden; }
.pdf-topbar { background: #0e0e0d; border-bottom: 1px solid rgba(255,255,255,.06); padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.pdf-back { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: pointer; padding: 5px 10px; border-radius: 6px; background: transparent; border: 1px solid rgba(255,255,255,.08); font-family: 'Inter', sans-serif; transition: all .15s; flex-shrink: 0; }
.pdf-back:hover { color: var(--text); border-color: rgba(255,255,255,.18); }
.pdf-doc-name { font-size: 12px; font-weight: 600; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pdf-meta { font-size: 11px; color: var(--muted); flex-shrink: 0; display: flex; align-items: center; gap: 12px; }
.pdf-dl { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); cursor: pointer; padding: 4px 8px; border-radius: 5px; transition: all .15s; border: 1px solid transparent; }
.pdf-dl:hover { color: var(--text); border-color: var(--border); }

.pdf-scroll { flex: 1; overflow-y: auto; padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.pdf-scroll::-webkit-scrollbar { width: 4px; }
.pdf-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }

/* PDF Page */
.pdf-page { background: #fff; width: 100%; max-width: 620px; padding: 60px 58px; box-shadow: 0 6px 32px rgba(0,0,0,.5); color: #111; font-family: 'Times New Roman', serif; font-size: 11px; line-height: 1.75; position: relative; }
.pdf-lh { text-align: center; margin-bottom: 30px; padding-bottom: 18px; border-bottom: 2px solid #1a1a1a; }
.pdf-lh-logo { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 800; letter-spacing: .25em; color: #1a1a1a; margin-bottom: 3px; }
.pdf-lh-sub { font-family: 'Inter', sans-serif; font-size: 8.5px; letter-spacing: .18em; color: #666; text-transform: uppercase; margin-bottom: 16px; }
.pdf-doc-title { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #111; margin-bottom: 4px; }
.pdf-doc-ref { font-family: 'Inter', sans-serif; font-size: 9px; color: #888; letter-spacing: .06em; }
.pdf-section { font-family: 'Inter', sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #333; margin: 20px 0 8px; padding-top: 12px; border-top: 1px solid #e0e0e0; }
.pdf-p { margin-bottom: 10px; color: #222; text-align: justify; }
.pdf-clause { margin-bottom: 8px; color: #222; }
.pdf-clause strong { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700; }
.pdf-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 10px; }
.pdf-table th { background: #f5f5f4; font-family: 'Inter', sans-serif; font-weight: 700; padding: 7px 10px; border: 1px solid #ddd; text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: #444; }
.pdf-table td { padding: 6px 10px; border: 1px solid #eee; color: #222; }
.pdf-table tr:nth-child(even) td { background: #fafaf9; }
.pdf-table .total td { font-family: 'Inter', sans-serif; font-weight: 700; background: #f0f0ee; }
.pdf-page-num { position: absolute; bottom: 22px; right: 58px; font-family: 'Inter', sans-serif; font-size: 9px; color: #aaa; }
.pdf-sig-zone { margin-top: 36px; padding: 20px; border: 1.5px dashed rgba(201,124,64,.6); background: rgba(201,124,64,.03); border-radius: 4px; }
.pdf-sig-label { font-family: 'Inter', sans-serif; font-size: 8.5px; font-weight: 700; color: #c97c40; text-transform: uppercase; letter-spacing: .14em; margin-bottom: 14px; }
.pdf-sig-lines { display: flex; gap: 32px; }
.pdf-sig-field { flex: 1; }
.pdf-sig-line { border-bottom: 1px solid #999; margin-bottom: 5px; height: 40px; display: flex; align-items: flex-end; padding-bottom: 4px; }
.pdf-sig-line img { max-height: 36px; max-width: 100%; }
.pdf-sig-line-typed { font-family: 'Georgia', serif; font-style: italic; font-size: 20px; color: #111; }
.pdf-sig-field-label { font-family: 'Inter', sans-serif; font-size: 8px; color: #888; }
.pdf-sig-date { font-family: 'Inter', sans-serif; font-size: 8.5px; color: #555; margin-top: 3px; }
.pdf-sig-zone.done { border-color: rgba(130,184,112,.5); background: rgba(130,184,112,.03); }
.pdf-sig-zone.done .pdf-sig-label { color: #82b870; }

/* ── ACTION PANEL ── */
.action-panel { flex: 1; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.ap-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.ap-type { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.ap-title { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -.01em; line-height: 1.3; margin-bottom: 5px; }
.ap-meta { font-size: 11px; color: var(--muted); }
.ap-expiry { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--amber); margin-top: 6px; }

/* Steps */
.steps { display: flex; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 0; }
.step { display: flex; align-items: center; gap: 6px; flex: 1; }
.step-circle { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--muted); flex-shrink: 0; transition: all .2s; }
.step-circle.active { border-color: var(--amber); color: var(--amber); }
.step-circle.done { border-color: var(--green); background: var(--green); color: #0c0c0b; }
.step-label { font-size: 11px; color: var(--muted); font-weight: 500; transition: color .2s; }
.step-label.active { color: var(--text); }
.step-label.done { color: var(--green); }
.step-connector { flex: 1; height: 1px; background: var(--border); margin: 0 8px; }

/* Action panel body */
.ap-body { flex: 1; overflow-y: auto; }
.ap-body::-webkit-scrollbar { width: 4px; }
.ap-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.ap-section { padding: 18px 24px; border-bottom: 1px solid var(--border); }
.ap-section:last-child { border-bottom: none; }
.ap-section-title { font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 10px; }
.broker-note { font-size: 12px; color: var(--text); line-height: 1.65; background: var(--surface-2); border-left: 2px solid var(--amber); border-radius: 0 6px 6px 0; padding: 12px 14px; }
.broker-author { font-size: 10px; color: var(--muted); margin-bottom: 6px; }

/* Review state footer */
.ap-footer { padding: 16px 24px; border-top: 1px solid var(--border); flex-shrink: 0; }
.btn-group { display: flex; gap: 8px; }
.btn-primary { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 20px; background: var(--amber); color: #fff; border: none; border-radius: 9px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; transition: background .15s; }
.btn-primary:hover { background: #d88d4e; }
.btn-primary.green { background: var(--green); color: #0c0c0b; }
.btn-primary.green:hover { background: #96cc83; }
.btn-secondary { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 20px; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all .15s; }
.btn-secondary:hover { color: var(--text); border-color: rgba(255,255,255,.2); }
.btn-danger { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 20px; background: rgba(192,67,58,.1); color: var(--red); border: 1px solid rgba(192,67,58,.2); border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all .15s; }
.btn-danger:hover { background: rgba(192,67,58,.2); }

/* Signature pad (in action panel) */
.sig-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.sig-tab { flex: 1; text-align: center; padding: 7px; border-radius: 7px; font-size: 12px; font-weight: 500; color: var(--muted); cursor: pointer; border: 1px solid transparent; transition: all .15s; }
.sig-tab.active { background: var(--surface-2); border-color: var(--border); color: var(--text); }
.sig-canvas-wrap { background: #fff; border-radius: 8px; position: relative; overflow: hidden; touch-action: none; }
.sig-canvas { display: block; width: 100%; height: 130px; }
.sig-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #bbb; pointer-events: none; font-family: 'Inter', sans-serif; transition: opacity .2s; }
.sig-clear { font-size: 11px; color: var(--muted); cursor: pointer; text-align: right; margin-top: 6px; }
.sig-clear:hover { color: var(--text); }
.sig-name-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 13px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; outline: none; transition: border-color .15s; margin-bottom: 10px; }
.sig-name-input:focus { border-color: rgba(130,184,112,.4); }
.sig-name-preview { background: #fff; border-radius: 7px; padding: 14px; text-align: center; font-size: 26px; color: #111; font-style: italic; min-height: 62px; display: flex; align-items: center; justify-content: center; font-family: 'Georgia', serif; }

/* Reject state */
.reject-textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 12px; resize: none; min-height: 90px; outline: none; transition: border-color .15s; }
.reject-textarea:focus { border-color: rgba(201,124,64,.4); }
.reject-textarea::placeholder { color: var(--muted); }

/* Done / Waiting / Readonly states */
.state-banner { padding: 20px; border-radius: 10px; display: flex; gap: 14px; align-items: flex-start; }
.state-banner.success { background: rgba(130,184,112,.08); border: 1px solid rgba(130,184,112,.18); }
.state-banner.waiting { background: rgba(201,124,64,.07); border: 1px solid rgba(201,124,64,.18); }
.state-banner.readonly { background: rgba(122,118,112,.06); border: 1px solid var(--border); }
.state-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.state-icon.green { background: rgba(130,184,112,.15); }
.state-icon.amber { background: rgba(201,124,64,.15); }
.state-icon.muted { background: rgba(122,118,112,.12); }
.state-title { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
.state-title.green { color: var(--green); }
.state-title.amber { color: var(--amber); }
.state-title.muted { color: var(--muted); }
.state-sub { font-size: 12px; color: var(--muted); line-height: 1.5; }

/* Sig record in readonly */
.sig-record { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border: 1px solid rgba(130,184,112,.2); border-radius: 8px; padding: 12px 14px; margin-top: 12px; }
.sig-record-img { background: #fff; border-radius: 5px; padding: 4px 10px; display: flex; align-items: center; min-width: 80px; justify-content: center; }
.sig-record-info { font-size: 11px; color: var(--muted); }
.sig-record-info strong { font-size: 12px; color: var(--text); display: block; margin-bottom: 2px; }

/* History in action panel */
.hist-event { display: flex; gap: 10px; padding-bottom: 14px; position: relative; }
.hist-event:not(:last-child)::before { content: ''; position: absolute; left: 11px; top: 24px; bottom: 0; width: 1px; background: var(--border); }
.hist-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.hist-dot.sent { background: rgba(122,118,112,.12); }
.hist-dot.signed { background: rgba(130,184,112,.15); }
.hist-dot.rejected { background: rgba(192,67,58,.12); }
.hist-dot.counter { background: rgba(201,124,64,.12); }
.hist-dot.approved { background: rgba(130,184,112,.15); }
.hist-body {}
.hist-actor { font-size: 12px; font-weight: 600; color: var(--text); }
.hist-date { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
.hist-text { font-size: 11px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 7px 10px; line-height: 1.5; }
.hist-ver-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 7px; font-size: 11px; color: var(--muted); cursor: pointer; padding: 4px 9px; border-radius: 5px; border: 1px solid var(--border); background: transparent; font-family: 'Inter', sans-serif; transition: all .15s; }
.hist-ver-link:hover { color: var(--text); border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.04); }
.prev-ver-banner { display: flex; align-items: center; gap: 8px; background: rgba(201,124,64,.07); border: 1px solid rgba(201,124,64,.2); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 11px; color: var(--amber); line-height: 1.4; }

/* ── PRINT / PDF EXPORT ── */
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { background: #fff !important; margin: 0; }
  .sidebar, .main, .pdf-topbar, .action-panel, .toast-wrap, .modal-close-x,

/* ──────────────────────────────────────────

function pendingCount() { return items.filter(i => i.status === 'pending' || i.status === 'rejected').length; }

/* ──────────────────────────────────────────
   RENDER LIST
────────────────────────────────────────── */
function docTypeIcon(item) {
  const svgs = {
    contrato: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2H4a1 1 0 00-1 1v10a1 1 0 001 1h8a1 1 0 001-1V5l-3-3z"/><path d="M10 2v3h3"/><path d="M5 8h6M5 11h4"/></svg>`,
    presupuesto: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5 7.5h6M5 10.5h3.5"/></svg>`,
    plan_pago: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5l2 1.5"/></svg>`,
    documento: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2H3a1 1 0 00-1 1v10a1 1 0 001 1h10a1 1 0 001-1V3a1 1 0 00-1-1z"/><path d="M5 6h6M5 9h4"/></svg>`,
  };
  return svgs[item.type] || svgs.documento;
}

function renderList() {
  const active = items.filter(i => i.status === 'pending' || i.status === 'rejected');
  const done   = items.filter(i => !['pending','rejected'].includes(i.status));
  const nPending = items.filter(i => i.status === 'pending').length;
  const area = document.getElementById('list-area');

  const accentColor = s => ({
    pending: 'var(--amber)',
    rejected: 'rgba(201,124,64,.35)',
    signed: 'var(--green)',
    approved: 'var(--green)',
    closed: 'var(--muted)',
  }[s] || 'var(--border)');

  const iconBg = t => ({
    contrato: 'rgba(201,124,64,.1)',
    presupuesto: 'rgba(130,184,112,.1)',
    plan_pago: 'rgba(122,118,112,.1)',
    documento: 'rgba(122,118,112,.1)',
  }[t] || 'rgba(122,118,112,.1)');

  function itemHTML(item) {
    const isPending = item.status === 'pending';
    const isWaiting = item.status === 'rejected';
    const isDone    = !isPending && !isWaiting;
    return `
    <div class="doc-item ${isDone ? 'is-done' : 'is-pending'}" onclick="openModal('${item.id}')">
      <div class="doc-accent" style="background:${accentColor(item.status)};"></div>
      <div class="doc-icon-wrap" style="background:${iconBg(item.type)};color:${item.typeColor};">
        ${docTypeIcon(item)}
      </div>
      <div class="doc-content">
        <div class="doc-item-title">
          ${item.title}
          ${item.version > 1 ? `<span class="doc-version">v${item.version}</span>` : ''}
          ${isWaiting ? `<span class="status-pill rejected">Esperando contraoferta</span>` : ''}
        </div>
        <div class="doc-item-meta">
          <span style="width:6px;height:6px;border-radius:50%;background:${item.typeColor};display:inline-block;flex-shrink:0;"></span>
          <span>${item.typeLabel}</span>
          <span class="doc-meta-sep">·</span>
          <span>${item.sentBy}</span>
          <span class="doc-meta-sep">·</span>
          <span>${item.sentDate}</span>
          ${item.expiresDate ? `<span class="doc-meta-sep">·</span>
            <span class="doc-expiry-inline">
              <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5l2 1.5"/></svg>
              Vence ${item.expiresDate}
            </span>` : ''}
        </div>
      </div>
      <div class="doc-right">
        ${item.amount ? `<div class="doc-amount-col">
          <div class="doc-amount-val">${item.amount}</div>
          ${item.amountSub ? `<div class="doc-amount-lbl">${item.amountSub}</div>` : ''}
        </div>` : ''}
        ${isDone ? `<span class="status-pill ${item.status}">${statusLabel[item.status] || item.status}</span>` : ''}
        ${isPending
          ? `<button class="btn-review primary" onclick="event.stopPropagation();openModal('${item.id}')">
              <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 2l4 4-7 7H3v-4l7-7z"/></svg>
              Revisar y firmar
            </button>`

      </div>
    </div>`;

  let html = `
    <div class="list-toolbar">
      <div class="list-filter-tabs">
        <div class="list-tab active">Todos <span style="opacity:.4;margin-left:3px;">${items.length}</span></div>

      Requiere tu atención
    </div>`;
    html += active.map(itemHTML).join('');
  }

  if (done.length) {
    html += `<div class="list-group-label" style="${active.length ? 'margin-top:28px;' : ''}">
      <span class="list-group-dot" style="background:var(--green);"></span>
      Completados
    </div>`;
    html += done.map(itemHTML).join('');
  }

  area.innerHTML = html;
}

/* ──────────────────────────────────────────

────────────────────────────────────────── */
function openModal(id) {
  activeId = id;
  const item = items.find(i => i.id === id);
  panelState = (item.status === 'pending') ? 'review'
    : (item.status === 'rejected') ? 'waiting'
    : 'readonly';

  document.getElementById('pdf-doc-name').textContent = item.title;
  document.getElementById('pdf-scroll').innerHTML = getPDFPages(item);
  document.getElementById('pdf-page-count').textContent =
    `${document.querySelectorAll('.pdf-page').length} página${document.querySelectorAll('.pdf-page').length > 1 ? 's' : ''}`;

  renderActionPanel();
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  activeId = null;
}

function handleDownload() {
  const item = items.find(i => i.id === activeId);
  if (!item) return;
  const prev = document.title;
  document.title = `${item.title}${item.version > 1 ? ` v${item.version}` : ''} — Makai Residences`;
  window.print();
  document.title = prev;
}

/* ──────────────────────────────────────────
   ACTION PANEL STATE MACHINE
────────────────────────────────────────── */
function renderActionPanel() {
  const item = items.find(i => i.id === activeId);
  if (!item) return;

  // Header
  document.getElementById('ap-header').innerHTML = `
    <div class="ap-type">
      <span style="width:7px;height:7px;border-radius:50%;background:${item.typeColor};display:inline-block;"></span>
      ${item.typeLabel}${item.version > 1 ? ` · v${item.version}` : ''}
    </div>
    <div class="ap-title">${item.title}</div>
    <div class="ap-meta">${item.sentBy} · ${item.sentDate}</div>
    ${item.expiresDate && item.status === 'pending' ? `
      <div class="ap-expiry">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5l2 1.5"/></svg>
        Vence el ${item.expiresDate} · ${item.daysLeft} días
      </div>` : ''}
  `;

  // Steps (only for active pending items)
  const showSteps = ['review','sign','done'].includes(panelState);
  const stepsEl = document.getElementById('ap-steps');
  stepsEl.style.display = showSteps ? 'flex' : 'none';
  if (showSteps) {
    const s1 = panelState === 'review' ? 'active' : 'done';
    const s2 = panelState === 'sign' ? 'active' : panelState === 'done' ? 'done' : '';
    const s3 = panelState === 'done' ? 'done' : '';
    stepsEl.innerHTML = `
      <div class="step">
        <div class="step-circle ${s1}">${s1==='done' ? '✓' : '1'}</div>
        <div class="step-label ${s1}">Revisar</div>
      </div>
      <div class="step-connector"></div>
      <div class="step">
        <div class="step-circle ${s2}">${s2==='done' ? '✓' : '2'}</div>
        <div class="step-label ${s2}">Firmar</div>
      </div>
      <div class="step-connector"></div>
      <div class="step">
        <div class="step-circle ${s3}">${s3==='done' ? '✓' : '3'}</div>
        <div class="step-label ${s3}">Listo</div>
      </div>
    `;
  }

  // Body + Footer per state
  const body = document.getElementById('ap-body');
  const footer = document.getElementById('ap-footer');

  if (panelState === 'review') {
    body.innerHTML = `
      <div class="ap-section">
        <div class="ap-section-title">Mensaje de tu asesor</div>
        <div class="broker-note">
          <div class="broker-author">${item.sentBy} · ${item.sentDate}</div>
          ${item.brokerNote}
        </div>
      </div>
      ${item.history.length > 1 ? `
      <div class="ap-section">
        <div class="ap-section-title">Historial</div>
        <div>${renderHistoryHTML(item.history, item.id)}</div>
      </div>` : ''}
    `;
    footer.innerHTML = `
      <div class="btn-group">
        <button class="btn-secondary" onclick="goToReject()" style="flex:0 0 auto;padding:11px 16px;color:var(--red);border-color:rgba(192,67,58,.22);">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4L4 12M4 4l8 8"/></svg>
          Rechazar
        </button>
        <button class="btn-primary" onclick="goToSign()">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 2l4 4-7 7H3v-4l7-7z"/></svg>
          Firmar documento
        </button>
      </div>
    `;
  }

  else if (panelState === 'sign') {
    sigMode = 'draw';
    drawHasContent = false;
    body.innerHTML = `
      <div class="ap-section">
        <div class="ap-section-title">Tu firma</div>
        <div class="sig-tabs">

/* ──────────────────────────────────────────
   SIGNATURE CANVAS
────────────────────────────────────────── */
function initCanvas() {
  const canvas = document.getElementById('sig-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let drawing = false;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - rect.left) * sx, y: (src.clientY - rect.top) * sy };
  }
  function startDraw(e) { e.preventDefault(); drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
  function draw(e) {
    if (!drawing) return; e.preventDefault();
    const p = getPos(e);
    ctx.lineTo(p.x, p.y); ctx.strokeStyle = '#111'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
    drawHasContent = true;
    const ph = document.getElementById('sig-placeholder');
    if (ph) ph.style.opacity = '0';
    checkSignReady();
  }
  function endDraw() { drawing = false; }
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', endDraw);
}

function clearSig() {
  const canvas = document.getElementById('sig-canvas');
  if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  drawHasContent = false;
  const ph = document.getElementById('sig-placeholder');
  if (ph) ph.style.opacity = '1';
  checkSignReady();
}

function switchSigTab(mode, el) {
  sigMode = mode;
  document.querySelectorAll('.sig-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const drawWrap = document.getElementById('sig-draw-wrap');
  const typeWrap = document.getElementById('sig-type-wrap');
  if (drawWrap) drawWrap.style.display = mode === 'draw' ? 'block' : 'none';
  if (typeWrap) typeWrap.style.display = mode === 'type' ? 'block' : 'none';
  checkSignReady();
}

function onTypeInput(val) {

function checkSignReady() {
  const btn = document.getElementById('btn-confirm-sign');
  if (!btn) return;
  const ready = sigMode === 'draw' ? drawHasContent
    : (document.getElementById('sig-name-input')?.value.trim().length > 0);

}

function showToast(msg, color) {
  const wrap = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="toast-dot ${color}"></span>${msg}`;
  wrap.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3800);
}
